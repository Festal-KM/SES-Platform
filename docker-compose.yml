# docker-compose.yml — ローカル開発コンテナ（T-01-02 / CLAUDE.md §2 / §11）
#
# APP_ENV=development の既定接続先。5 サービス: PostgreSQL / Redis / s3mock（S3 互換） / MailHog / ClamAV。
# 加えて 1 回だけ走る初期化コンテナ s3mock-init（バージョニング有効化。T-05-06）。
# 起動: docker compose up -d（🔴 `--wait` は使わない。s3mock-init は終了するコンテナであり待てない）
# 疎通確認: tests/smoke/docker-services.test.ts（pnpm test:smoke）
#
# 🔴 本ファイルが定義するのは development 専用の最小構成である。
#    demo / sandbox / staging / production は CLAUDE.md §11 のとおり外部サービス
#    （RDS / ElastiCache / S3 / GuardDuty / 実 SMTP）を使う。ここで固定した資格情報は
#    ローカル専用の既定値であり、本番相当の環境には絶対に流用しない。
name: ses-platform

services:
  postgres:
    image: postgres:17-bookworm
    container_name: ses-postgres
    restart: unless-stopped
    # 🔴 T-01-05: development でも DATABASE_URL / PLATFORM_DATABASE_URL に sslmode=require を
    #    要求する（docs/05 §4.2 / §13.4 規則 4 の development 例外解除）ため、自己署名証明書で
    #    TLS を有効化した起動スクリプトに差し替える（docker/postgres/entrypoint-ssl.sh）。
    entrypoint: ['bash', '/docker-entrypoint-ssl.sh']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ses_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ses_platform}
      # ロール別パスワード（docker/postgres/initdb/000-roles.sh。ローカル専用ダミー値）。
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:-app_migrator_dev_password}
      APP_TENANT_PASSWORD: ${APP_TENANT_PASSWORD:-app_tenant_dev_password}
      APP_PLATFORM_PASSWORD: ${APP_PLATFORM_PASSWORD:-app_platform_dev_password}
      APP_PLATFORM_WRITE_PASSWORD: ${APP_PLATFORM_WRITE_PASSWORD:-app_platform_write_dev_password}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ses_postgres_data:/var/lib/postgresql/data
      # pg_trgm を有効化し、pg_bigm は使える場合のみ有効化する（docs/03 §3.7.2 / TBD-8）。
      # 000-roles.sh は packages/db/prisma/sql/000_roles.sql（唯一のロール定義）を適用する。
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./packages/db/prisma/sql/000_roles.sql:/opt/ses/000_roles.sql:ro
      - ./docker/postgres/entrypoint-ssl.sh:/docker-entrypoint-ssl.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ses-redis
    restart: unless-stopped
    # BullMQ の永続化前提（CLAUDE.md §2「Redis / Valkey ^7。AOF 有効」docs/03 §5.2）。
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - ses_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # 🔴 **オブジェクトストレージ（S3 互換）は adobe/s3mock である**（2026-09-28。Issue #75）。
  #    MinIO のコンテナイメージが匿名で取得できなくなり（docker.io / quay.io = 401、ghcr.io = 403。
  #    **401 はリポジトリ単位なので古いタグへの固定でも回避できず、ミラーも作れない**）、
  #    CI の E2E がイメージ取得の段階で落ちたためである。実測の一覧と、失う忠実度
  #    （SigV4 の署名検証。s3mock はどんな署名でも通す）の評価は
  #    `tests/e2e/harness/object-storage.ts` 冒頭のコメントに書いた —— **経緯は 1 箇所に置く**。
  # 🔴 `tests/e2e/harness/object-storage.ts` と**同じイメージ・同じタグ**に揃える
  #    （`:latest` の浮動タグを避ける。片方だけ変えるとローカルと CI で別のイメージを引く）。
  # ⚠️ s3mock は資格情報を検証しない。`S3_ACCESS_KEY_ID` / `S3_SECRET_ACCESS_KEY` は
  #    `packages/config` が必須にしているのでアプリ側には残るが、このコンテナには渡さない
  #    （渡すと「効いている」と誤解させる）。
  s3mock:
    image: adobe/s3mock:4.7.0
    container_name: ses-s3mock
    restart: unless-stopped
    environment:
      # バケットの作成はここで行う（MinIO 時代の `mc mb` は不要になった）。
      initialBuckets: ${S3_BUCKET:-ses-platform-dev}
      # 🔴 既定は false（終了時にファイルを消す）。development は再起動でアップロード済みの
      #    スキルシートが消えると `skill_sheets` の行だけが残るため、保持する側に倒す。
      #    ボリュームを付けたうえで、バケット・バージョニング設定・オブジェクトが
      #    `docker restart` を跨いで残ることを実測で確認した。
      retainFilesOnExit: 'true'
    ports:
      # 🔴 コンテナ内のポートは 9090（s3mock の HTTP。9191 は HTTPS で使わない）。ホスト側は
      #    9000 のまま公開し、`S3_ENDPOINT=http://localhost:9000` を変えずに済ませる。
      - '127.0.0.1:${S3MOCK_API_PORT:-9000}:9090'
    volumes:
      # イメージ既定の `root=/s3mockroot`（コンテナの環境変数）に合わせる。
      - ses_s3mock_data:/s3mockroot
    healthcheck:
      # 🔴 `GET /`（ListBuckets）が 200 なら S3 API が応答している。`/actuator/health` は
      #    `Accept: application/json` を要求し、付けないと 406 を返す（実測）ため使わない。
      #    curl はこのイメージに無い（busybox の wget を使う）。
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9090/']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # 🔴 T-05-06: **バージョニングの有効化**（1 回だけ走って終了する初期化）。
  #    development のストレージ初期化はこの 1 箇所に集める。
  #
  # 🔴 なぜバージョニングが必須か: `ObjectStore.head()` は `VersionId` が空なら**例外**にする
  #    （`packages/connectors/src/storage/aws-sdk-s3.ts` の `toHeadResponse`）。理由は
  #    docs/05 §14.1 が「バージョニング有効」を前提にしており、`FileScanResult` の重複排除キー
  #    （`UNIQUE(object_key, object_version_id)`）が版 ID を要求するためである。バージョニングの
  #    無いバケットでは `VersionId` が返らず、**アップロードの確定（#19）が必ず失敗する**。
  #    「未設定なら空文字で代替」は、全オブジェクトの重複排除キーが衝突する壊れ方になる
  #    （`CLAUDE.md` §11.1 の「静かに degrade させない」と同じ判断）。
  #    🔴 s3mock の `initialBuckets` はバケットを作るだけで、**バージョニングは既定で無効**である
  #    （有効化前の `PutObject` は `x-amz-version-id` を返さないことを実測で確認した）。
  #
  # 🔴 なぜ初期化に**この同じイメージ**を使うか: 新しいレジストリ依存を 1 つも増やさないためである
  #    （MinIO 時代の `minio/mc` が取得不能になったのが Issue #75 の原因の半分でもある）。
  #    s3mock のイメージには busybox が入っており、`nc`（PUT の送信）と `wget`（確認の GET）だけで足りる。
  #    ⚠️ 署名は付けない。s3mock は SigV4 を検証しないため不要である（実測）。
  # 🔴 PUT の 2xx で満足せず、**読み直して `Enabled` を確認して**から成功にする。黙って無効のままだと
  #    「アップロードの確定が失敗する」という遠い症状でしか気づけない。
  #
  # 🔴 CORS はここでは設定しない（T-05-06 / T-05-10 の e2e-tester 所見への回答。実測に基づく）。
  #    スキルシートは**ブラウザからオブジェクトストレージへ直接 PUT** する（docs/05 §14.2）。この PUT は
  #    `Content-Type` / `Content-Length` を伴う**非単純リクエスト**なので、ブラウザは必ず OPTIONS
  #    のプリフライトを送る。ただし **s3mock は既定で全 origin を許可する**（MinIO と同じ）——
  #    素の s3mock へ任意の Origin でプリフライトを投げると `200` +
  #    `Access-Control-Allow-Origin: <その origin>` + `Access-Control-Allow-Methods: PUT` が返ることを
  #    実測で確認した。したがって `development` の設定は不要であり、**動かないものを設定で埋めない**。
  # 🔴 **実 S3（`sandbox` / `staging` / `production`）は既定で全拒否であり、`PutBucketCors` が
  #    無いと S-008 のアップロードは必ず失敗する。** 設定は環境構築（SP-12 T-12-09）で行う
  #    （docs/05 §14.2 / docs/03 §4.18.1）。
  #
  # ⚠️ このサービスは終了する（`restart: "no"`）。`docker compose up -d --wait` は
  #    「終了したコンテナ」を待てないため、起動は `docker compose up -d` を使うこと。
  s3mock-init:
    image: adobe/s3mock:4.7.0
    container_name: ses-s3mock-init
    depends_on:
      s3mock:
        condition: service_healthy
    restart: 'no'
    environment:
      S3_BUCKET: ${S3_BUCKET:-ses-platform-dev}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        BODY='<VersioningConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Status>Enabled</Status></VersioningConfiguration>'
        printf 'PUT /%s?versioning HTTP/1.1\r\nHost: s3mock:9090\r\nContent-Type: application/xml\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s' \
          "$${S3_BUCKET}" "$${#BODY}" "$${BODY}" | nc s3mock 9090 | head -1
        wget -q -O - "http://s3mock:9090/$${S3_BUCKET}?versioning" | grep -q '<Status>Enabled</Status>'
        echo "versioning enabled: $${S3_BUCKET}"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ses-mailhog
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILHOG_WEB_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8025/api/v2/messages']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  clamav:
    # 🔴 :stable の浮動タグを避け、確認済みのバージョンタグに固定する（code-reviewer 指摘 #4）。
    image: clamav/clamav:1.5.4
    container_name: ses-clamav
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    volumes:
      - ses_clamav_data:/var/lib/clamav
    healthcheck:
      # 🔴 初回起動はウイルス定義 DB のダウンロードで数分かかることがある
      #    （SP-01 T-01-02 実装ガイド）。start_period を長く取り、スモークテストも待機を許容する。
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 300s

volumes:
  ses_postgres_data:
  ses_redis_data:
  ses_s3mock_data:
  ses_clamav_data:
