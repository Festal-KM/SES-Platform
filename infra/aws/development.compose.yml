# アプリはAWSの開発VMで動かす。PCにはSSM転送とブラウザーだけを置く。
services:
  s3mock:
    environment:
      JAVA_TOOL_OPTIONS: '-Xmx384m'
  tools:
    image: node:24-bookworm
    network_mode: host
    working_dir: /app
    volumes:
      - /workspaces/ses-platform:/app
    profiles: [tools]
    command: ['node', 'scripts/aws-development-initialize.mjs']
  # ✅ 2026-11-01: 画面（web / worker）はビルド用とは別の「-live」コピーから動かす。
  #    反映は /workspaces/ses-platform でビルドし終えてから差分だけを -live へ写して再起動する
  #    （aws-bootstrap-development.sh）。ビルドの間も古い画面が動き続ける（以前はずっと 502 だった）。
  web:
    image: node:24-bookworm
    container_name: ses-development-web
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    user: '1000:1000'
    env_file: /workspaces/ses-platform-live/.runtime.env
    volumes:
      - /workspaces/ses-platform-live:/app
    command: ['node', 'scripts/aws-development-server.mjs', 'web']
    stop_grace_period: 60s
  worker:
    image: node:24-bookworm
    container_name: ses-development-worker
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    user: '1000:1000'
    env_file: /workspaces/ses-platform-live/.runtime.env
    volumes:
      - /workspaces/ses-platform-live:/app
    command: ['node', 'scripts/aws-development-server.mjs', 'worker']
    stop_grace_period: 60s
