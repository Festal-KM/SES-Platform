# アプリはAWSの開発VMで動かす。PCにはSSM転送とブラウザーだけを置く。
services:
  s3mock:
    environment:
      JAVA_TOOL_OPTIONS: '-Xmx384m'
  tools:
    image: node:24-bookworm
    network_mode: host
    working_dir: /app
    volumes:
      - /workspaces/ses-platform:/app
    profiles: [tools]
    command: ['node', 'scripts/aws-development-initialize.mjs']
  web:
    image: node:24-bookworm
    container_name: ses-development-web
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    user: '1000:1000'
    env_file: /workspaces/ses-platform/.runtime.env
    volumes:
      - /workspaces/ses-platform:/app
    command: ['node', 'scripts/aws-development-server.mjs', 'web']
    stop_grace_period: 60s
  worker:
    image: node:24-bookworm
    container_name: ses-development-worker
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    user: '1000:1000'
    env_file: /workspaces/ses-platform/.runtime.env
    volumes:
      - /workspaces/ses-platform:/app
    command: ['node', 'scripts/aws-development-server.mjs', 'worker']
    stop_grace_period: 60s
